[project]
name = "orbitscout"
version = "0.1.0"
description = "Score DJI flight telemetry for 3D-reconstruction suitability, then reconstruct."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.scripts]
orbitscout = "dronecv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronecv"]
